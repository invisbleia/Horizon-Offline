name: nightly audit
# Manual, read-only validation on the game runner. Scheduled issue reporting is disabled in Horizon-Offline.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-audit
  cancel-in-progress: false
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  audit:
    # The Mac mini's runners only: the audit compares with the previous one, so it stays on one platform.
    runs-on: [self-hosted, horizon-game, macOS]
    timeout-minutes: 240  # every harness (~80 min) plus lan_integration (~40 min an attempt under load, retried)
    steps:
      - name: Start audit
        id: when
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.when.outputs.run == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
          # Keeps .local/ (parity state, probe builds, the previous audit) and target/.
          clean: false
      - uses: dtolnay/rust-toolchain@stable
        if: steps.when.outputs.run == 'true'
      - name: Tools from the runner
        if: steps.when.outputs.run == 'true'
        run: bash tools/ci/runner-env.sh
      - name: Vanilla data, prepared again if the preparer changed
        if: steps.when.outputs.run == 'true'
        run: bash tools/ci/vanilla-data.sh
      - name: Every harness
        id: audit
        if: steps.when.outputs.run == 'true'
        env:
          PARITY_HOSTS: ''
        run: |
          set +e
          # lan_integration (the whole lan_e2e suite) takes ~2,400 s under load, past the usual 1,800.
          python3 tools/parity.py --all --timeout 3000 2>&1 | tee "$RUNNER_TEMP/audit.log"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo '```'; tail -40 "$RUNNER_TEMP/audit.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs of the failed harnesses
        if: steps.when.outputs.run == 'true' && steps.audit.outputs.exit != '0'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-parity-logs
          path: .local/parity-runner/logs/
          if-no-files-found: ignore
          retention-days: 7
